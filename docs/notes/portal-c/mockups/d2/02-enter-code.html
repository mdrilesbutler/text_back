<!doctype html>
<html lang="en" class="no-js p-enter-code">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check your phone · TextBack</title>
<link rel="stylesheet" href="../_assets/portal.css">
<link rel="stylesheet" href="d2.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell shell--auth">
<header class="hd">
  <span class="hd__brand"><span class="hd__mark" aria-hidden="true"></span>TextBack</span>
</header>
<main id="main" class="main main--auth" tabindex="-1">
  <div class="col">
    <div class="slot" role="status" id="status"></div>
<div class="auth2">
  <div class="ph">
    <p class="eyebrow">Oak &amp; Pine Tree Care</p>
    <h1>Check your phone</h1>
    <p class="ph__intro">Enter the six-digit code we just texted. It expires in ten minutes.</p>
  </div>
  <form class="auth2__form" method="post" action="/client/verify" novalidate>
    <div class="field">
      <label class="field__label" for="code">Sign-in code</label>
      <div class="otp" data-filled="0">
        <span class="otp__cells" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <input class="otp__input" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*">
      </div>
    </div>
    <div class="switch-block">
      <label class="switch-row"><span class="switch-row__text">Remember this phone for 30 days</span><input class="switch" type="checkbox" role="switch" name="remember" checked></label>
      <p class="switch-row__note">Otherwise this phone signs out after 12 hours.</p>
    </div>
    <button class="btn btn--primary btn--block" type="submit">Sign in</button>
  </form>
  <a class="auth2__link" href="/client/login">Didn&#39;t get it? Send a new code</a>
  <p class="auth2__foot">TextBack by FluxWorks</p>
</div>
  </div>
</main>
</div>
</body>
</html>
