<!doctype html>
<html lang="en" class="no-js p-sign-in">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · TextBack</title>
<link rel="stylesheet" href="../_assets/portal.css">
<link rel="stylesheet" href="d2.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell shell--auth">
<header class="hd">
  <span class="hd__brand"><span class="hd__mark" aria-hidden="true"></span>TextBack</span>
</header>
<main id="main" class="main main--auth" tabindex="-1">
  <div class="col">
    <div class="slot" role="status" id="status"></div>
<div class="auth2">
  <div class="ph">
    <p class="eyebrow">Owner settings</p>
    <h1>Sign in</h1>
    <p class="ph__intro">Enter your mobile number. We text a six-digit code to the mobile on file for this business. No password.</p>
  </div>
  <form class="auth2__form" method="post" action="/client/login" novalidate>
    <div class="field">
      <label class="field__label" for="mobile">Your mobile number</label>
      <input class="input input--tel" id="mobile" name="mobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="10 digits" value="">
    </div>
    <button class="btn btn--primary btn--block" type="submit">Text me a code</button>
  </form>
  <p class="auth2__foot">TextBack by FluxWorks</p>
</div>
  </div>
</main>
</div>
</body>
</html>
