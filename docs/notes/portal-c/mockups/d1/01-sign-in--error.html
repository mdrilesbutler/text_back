</svg><a class="skip" href="#main">Skip to content</a>
<header class="topbar topbar--auth"><span class="brand"><svg class="icon brand__icon" aria-hidden="true" focusable="false"><use href="#i-missed"/></svg>TextBack</span></header>
<main class="page auth" id="main" tabindex="-1">
  <div class="auth__card">
    <ol class="stepper">
      <li class="stepper__step stepper__step--current"><span class="stepper__dot">1</span><span class="stepper__label">Sign in</span></li>
      <li class="stepper__step"><span class="stepper__dot">2</span><span class="stepper__label">Check your phone</span></li>
    </ol>
<div class="auth__head">
  <h1>Oak &amp; Pine Tree Care</h1>
  <p class="auth__sub">Sign in to TextBack</p>
  <p class="lead">Enter your mobile number. We text a six-digit code to the mobile on file for this business. No password.</p>
</div>
<form class="auth__form" method="post" action="/client/login">
  <div class="field" id="focus">
    <label class="field__label" for="mobile">Your mobile number</label>
    <input class="input input--tel" id="mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10 digits" value="" aria-invalid="true" aria-describedby="mobile-error">
<p class="field-error" id="mobile-error"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-alert"/></svg><span>Enter your mobile as 10 digits, area code first.</span></p>  </div>
  <button class="btn btn--primary btn--lg btn--block" type="submit">Text me a code</button>
</form>
    <p class="auth__foot">TextBack by FluxWorks</p>
  </div>
</main>
</body>
</html>
