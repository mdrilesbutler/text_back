<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>text_back — Response Workflow Designer</title>
<style>
:root{
  --bg:#1a1a2e; --bg2:#16162a; --panel:#232338; --panel2:#2a2a44;
  --line:#3a3a5c; --text:#e8e8f2; --dim:#9a9ab8; --faint:#6b6b8f;
  --orange:#ff6d5a; --blue:#4a90e2; --purple:#9b6dff; --green:#3ecf8e;
  --grey:#6b7280; --amber:#f0a842; --red:#ff5470;
  --node-bg:#26263e; --node-border:#3d3d61; --node-hover:#4c4c7a;
  --accent:#ff6d5a;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px;
}
/* ---------- header ---------- */
#header{
  height:52px; display:flex; align-items:center; gap:14px; padding:0 18px;
  background:linear-gradient(180deg,#20203a,#1c1c32); border-bottom:1px solid var(--line);
  position:relative; z-index:40;
}
#header .logo{
  width:30px; height:30px; border-radius:8px; flex:0 0 auto;
  background:linear-gradient(135deg,var(--orange),#ff9d5a);
  display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:15px;
  box-shadow:0 2px 10px rgba(255,109,90,.35);
}
#header h1{font-size:15px; font-weight:600; letter-spacing:.2px;}
#header h1 .tb{color:var(--orange); font-weight:800;}
#header .byline{font-size:11px; color:var(--faint); margin-left:2px; letter-spacing:.6px; text-transform:uppercase;}
#header .spacer{flex:1;}
.hbtn{
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:7px 13px; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:7px;
  transition:all .15s;
}
.hbtn:hover{border-color:var(--purple); background:var(--panel2);}
.hbtn.primary{background:var(--orange); border-color:var(--orange); color:#fff; font-weight:600;}
.hbtn.primary:hover{background:#ff8471;}
#selCount{
  background:#fff2; border-radius:10px; padding:1px 8px; font-size:11px; font-weight:700;
}
/* ---------- canvas ---------- */
#stage{position:absolute; top:52px; left:0; right:0; bottom:0; overflow:hidden;
  background-color:var(--bg);
  background-image:radial-gradient(circle,#33334f 1px,transparent 1px);
  background-size:22px 22px; cursor:grab;
}
#stage.panning{cursor:grabbing;}
#world{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform;}
#edgeSvg{position:absolute; top:0; left:0; overflow:visible; pointer-events:none;}
.edgePath{fill:none; stroke:#55557f; stroke-width:2;}
.edgePath.hot{stroke:var(--orange);}
.edgeLabel{fill:#b8b8d8; font-size:11px; font-weight:600;}
.edgeLabelBg{fill:#1a1a2e; stroke:#3a3a5c; stroke-width:1; rx:6;}
.port{fill:#8a8ab5; stroke:#1a1a2e; stroke-width:2;}
/* ---------- nodes ---------- */
.node{
  position:absolute; width:224px; min-height:62px; background:var(--node-bg);
  border:1.5px solid var(--node-border); border-radius:12px; display:flex; align-items:center;
  cursor:pointer; user-select:none; transition:border-color .12s, box-shadow .12s;
  box-shadow:0 3px 12px rgba(0,0,0,.35);
}
.node:hover{border-color:var(--node-hover); box-shadow:0 5px 18px rgba(0,0,0,.5);}
.node.active{border-color:var(--orange); box-shadow:0 0 0 3px rgba(255,109,90,.22), 0 5px 18px rgba(0,0,0,.5);}
.node .nicon{
  width:44px; height:44px; border-radius:10px; margin:9px 11px 9px 9px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
}
.node .nicon svg{width:22px; height:22px;}
.node .nbody{flex:1; padding-right:10px; min-width:0;}
.node .ntitle{font-size:13px; font-weight:600; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.node .nsub{font-size:10.5px; color:var(--dim); margin-top:2px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.node .badge{
  position:absolute; top:-8px; right:-8px; width:20px; height:20px; border-radius:50%;
  background:var(--green); color:#0c2b1d; display:none; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; border:2px solid var(--bg); box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.node.hasSel .badge{display:flex;}
.node .msgTag{
  position:absolute; bottom:-9px; left:12px; background:var(--panel2); border:1px solid var(--line);
  border-radius:8px; font-size:9px; padding:1px 7px; color:var(--dim); letter-spacing:.4px;
}
/* ---------- zoom controls ---------- */
#zoomCtl{position:absolute; left:16px; bottom:16px; display:flex; flex-direction:column; gap:6px; z-index:30;}
#zoomCtl button{
  width:36px; height:36px; border-radius:9px; background:var(--panel); border:1px solid var(--line);
  color:var(--text); font-size:16px; cursor:pointer; transition:all .15s;
}
#zoomCtl button:hover{border-color:var(--purple); background:var(--panel2);}
#zoomPct{position:absolute; left:60px; bottom:22px; font-size:11px; color:var(--faint); z-index:30;}
#legend{
  position:absolute; right:16px; bottom:16px; z-index:30; background:rgba(35,35,56,.9); border:1px solid var(--line);
  border-radius:10px; padding:10px 13px; font-size:11px; color:var(--dim); display:flex; gap:14px; backdrop-filter:blur(4px);
}
#legend .li{display:flex; align-items:center; gap:6px;}
#legend .sw{width:11px; height:11px; border-radius:3.5px;}
/* ---------- side panel ---------- */
#panel{
  position:absolute; top:52px; right:0; bottom:0; width:420px; max-width:92vw;
  background:var(--panel); border-left:1px solid var(--line); z-index:50;
  transform:translateX(105%); transition:transform .22s ease; display:flex; flex-direction:column;
  box-shadow:-12px 0 40px rgba(0,0,0,.45);
}
#panel.open{transform:translateX(0);}
#pHead{padding:16px 18px 12px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; gap:12px;}
#pHead .picon{width:40px; height:40px; border-radius:10px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
#pHead .picon svg{width:20px; height:20px;}
#pTitle{font-size:15px; font-weight:700;}
#pSub{font-size:11.5px; color:var(--dim); margin-top:3px; line-height:1.45;}
#pClose{margin-left:auto; background:none; border:none; color:var(--faint); font-size:20px; cursor:pointer; padding:2px 6px; border-radius:6px;}
#pClose:hover{color:var(--text); background:var(--panel2);}
#pTabs{display:flex; gap:4px; padding:10px 14px 0; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.ptab{
  background:none; border:none; color:var(--dim); font-size:12px; font-weight:600; padding:8px 11px;
  border-bottom:2px solid transparent; cursor:pointer; border-radius:6px 6px 0 0;
}
.ptab:hover{color:var(--text);}
.ptab.on{color:var(--orange); border-bottom-color:var(--orange);}
#pTools{padding:12px 16px 4px;}
#pSearch{
  width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:8px; color:var(--text);
  padding:8px 12px; font-size:13px; outline:none;
}
#pSearch:focus{border-color:var(--purple);}
#toneRow{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap;}
.tchip{
  background:var(--bg2); border:1px solid var(--line); color:var(--dim); border-radius:20px;
  padding:4px 11px; font-size:11px; font-weight:600; cursor:pointer; transition:all .12s;
}
.tchip:hover{color:var(--text); border-color:var(--faint);}
.tchip.on{background:var(--purple); border-color:var(--purple); color:#fff;}
#pBody{flex:1; overflow-y:auto; padding:12px 16px 24px;}
#pBody::-webkit-scrollbar{width:9px;}
#pBody::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
.pnote{
  background:rgba(155,109,255,.08); border:1px solid rgba(155,109,255,.3); border-radius:9px;
  padding:10px 13px; font-size:12px; color:#c9b8f5; line-height:1.55; margin-bottom:12px;
}
.pnote b{color:#ddd0ff;}
.tcount{font-size:11px; color:var(--faint); margin:2px 2px 10px;}
/* template card */
.tcard{
  background:var(--bg2); border:1.5px solid var(--line); border-radius:11px; padding:11px 13px;
  margin-bottom:10px; cursor:pointer; transition:border-color .12s, background .12s; position:relative;
}
.tcard:hover{border-color:var(--node-hover);}
.tcard.sel{border-color:var(--green); background:rgba(62,207,142,.07);}
.tcard .trow{display:flex; align-items:center; gap:7px; margin-bottom:7px; flex-wrap:wrap;}
.tcard .radio{
  width:15px; height:15px; border-radius:50%; border:2px solid var(--faint); flex:0 0 auto; position:relative;
}
.tcard.sel .radio{border-color:var(--green);}
.tcard.sel .radio::after{
  content:''; position:absolute; inset:2.5px; border-radius:50%; background:var(--green);
}
.pill{font-size:9.5px; font-weight:700; letter-spacing:.4px; padding:2px 8px; border-radius:10px; text-transform:uppercase;}
.pill.tone-pro{background:rgba(74,144,226,.18); color:#8bbcf0;}
.pill.tone-friendly{background:rgba(62,207,142,.16); color:#7fe0b4;}
.pill.tone-casual{background:rgba(240,168,66,.16); color:#f5c67e;}
.pill.tone-urgent{background:rgba(255,84,112,.16); color:#ff8ba0;}
.pill.ind{background:rgba(155,109,255,.14); color:#bda4f7;}
.pill.comp-ok{background:rgba(62,207,142,.16); color:#7fe0b4;}
.pill.comp-warn{background:rgba(255,84,112,.18); color:#ff8ba0;}
.tcard .ttext{font-size:13px; line-height:1.55; color:var(--text); word-wrap:break-word;}
.tcard .ttext .tok{color:var(--amber); font-weight:600;}
.tcard .tfoot{display:flex; align-items:center; gap:10px; margin-top:8px; font-size:10.5px; color:var(--faint);}
.tcard .tfoot .over{color:var(--amber);}
.copyBtn{
  margin-left:auto; background:var(--panel2); border:1px solid var(--line); color:var(--dim);
  border-radius:7px; padding:3px 10px; font-size:10.5px; cursor:pointer;
}
.copyBtn:hover{color:var(--text); border-color:var(--faint);}
.copyBtn.done{color:var(--green); border-color:var(--green);}
/* info panel (non-message nodes) */
.infoBlock{font-size:13px; line-height:1.65; color:var(--dim);}
.infoBlock h4{color:var(--text); font-size:12px; text-transform:uppercase; letter-spacing:.7px; margin:16px 0 6px;}
.infoBlock ul{margin:4px 0 4px 18px;}
.infoBlock li{margin:4px 0;}
.infoBlock code{background:var(--bg2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:11.5px; color:var(--amber);}
/* ---------- selections drawer ---------- */
#drawer{
  position:absolute; top:52px; right:0; bottom:0; width:480px; max-width:94vw; background:var(--panel);
  border-left:1px solid var(--line); z-index:60; transform:translateX(105%); transition:transform .22s ease;
  display:flex; flex-direction:column; box-shadow:-12px 0 40px rgba(0,0,0,.5);
}
#drawer.open{transform:translateX(0);}
#dHead{padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;}
#dHead h3{font-size:15px;}
#dBody{flex:1; overflow-y:auto; padding:14px 18px;}
#dBody::-webkit-scrollbar{width:9px;}
#dBody::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
.dItem{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:11px 14px; margin-bottom:10px;}
.dItem .dstep{font-size:10.5px; font-weight:700; color:var(--orange); letter-spacing:.5px; text-transform:uppercase;}
.dItem .dtext{font-size:12.5px; line-height:1.55; margin-top:5px;}
.dItem .dtext .tok{color:var(--amber); font-weight:600;}
.dItem .dempty{font-size:12px; color:var(--faint); font-style:italic; margin-top:4px;}
.dItem .dmeta{font-size:10px; color:var(--faint); margin-top:6px;}
#dFoot{padding:14px 18px; border-top:1px solid var(--line); display:flex; gap:10px;}
#dFoot .hbtn{flex:1; justify-content:center;}
#toast{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(80px); z-index:100;
  background:var(--panel2); border:1px solid var(--green); color:var(--text); border-radius:10px;
  padding:10px 20px; font-size:13px; transition:transform .25s; box-shadow:0 8px 24px rgba(0,0,0,.5);
}
#toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="header">
  <div class="logo">t</div>
  <div>
    <h1><span class="tb">text_back</span> — Response Workflow Designer</h1>
  </div>
  <span class="byline">a Fluxworks product</span>
  <div class="spacer"></div>
  <button class="hbtn" id="fitBtn" title="Fit workflow to view">⤢ Fit view</button>
  <button class="hbtn primary" id="drawerBtn">Selections <span id="selCount">0</span></button>
</div>

<div id="stage">
  <div id="world">
    <svg id="edgeSvg"></svg>
    <div id="nodes"></div>
  </div>
</div>

<div id="zoomCtl">
  <button id="zin" title="Zoom in">+</button>
  <button id="zout" title="Zoom out">−</button>
  <button id="zfit" title="Fit view">⤢</button>
</div>
<div id="zoomPct">100%</div>

<div id="legend">
  <div class="li"><span class="sw" style="background:var(--orange)"></span>Trigger</div>
  <div class="li"><span class="sw" style="background:var(--blue)"></span>Message</div>
  <div class="li"><span class="sw" style="background:var(--purple)"></span>Logic</div>
  <div class="li"><span class="sw" style="background:var(--green)"></span>Done</div>
  <div class="li"><span class="sw" style="background:var(--grey)"></span>End state</div>
</div>

<div id="panel">
  <div id="pHead">
    <div class="picon" id="pIcon"></div>
    <div style="min-width:0">
      <div id="pTitle"></div>
      <div id="pSub"></div>
    </div>
    <button id="pClose">✕</button>
  </div>
  <div id="pTabs"></div>
  <div id="pTools">
    <input id="pSearch" type="text" placeholder="Search templates…">
    <div id="toneRow"></div>
  </div>
  <div id="pBody"></div>
</div>

<div id="drawer">
  <div id="dHead">
    <h3>Your selected responses</h3>
    <div class="spacer" style="flex:1"></div>
    <button id="dClose" class="hbtn">✕ Close</button>
  </div>
  <div id="dBody"></div>
  <div id="dFoot">
    <button class="hbtn" id="clearBtn">Clear all</button>
    <button class="hbtn primary" id="exportBtn">⬇ Export selections (JSON)</button>
  </div>
</div>

<div id="toast">Copied</div>

<script>
'use strict';
/* =====================================================================
   text_back — missed-call → SMS recovery flow (deterministic, no LLM)
   ===================================================================== */

const COLORS = {trigger:'#ff6d5a', action:'#4a90e2', logic:'#9b6dff', wait:'#f0a842', done:'#3ecf8e', end:'#6b7280'};

const ICONS = {
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.5 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  msg:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  branch:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 3v12M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/></svg>',
  help:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg>',
  zap:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  hourglass:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 2h12M6 22h12M8 2v4l4 4 4-4V2M8 22v-4l4-4 4 4v4"/></svg>'
};

/* ---------- node graph ---------- */
const NODES = [
 {id:'trigger',      x:40,   y:340, type:'trigger', icon:'phone',  title:'Missed Call Received', sub:'Carrier conditional-forwarding webhook', cats:[],
   info:{what:'Fires when a call to the business number rings out or is declined. The carrier forwards call metadata (caller number, timestamp, line) to the text_back webhook. Nothing is sent yet.', notes:['Dedupe window: same caller within 10 min = one event','Landline callers with no SMS capability are dropped silently','All downstream behaviour is deterministic policy — no LLM in the message path']}},
 {id:'guard',        x:330,  y:340, type:'logic',   icon:'shield', title:'Opted Out?', sub:'Suppression-list check', cats:[],
   info:{what:'Checks the caller against the opt-out suppression list before any message is composed. This gate runs first, always.', notes:['Suppressed numbers get zero messages — the event is logged and closed','List is append-only; re-opt-in requires the customer to text START','This is a compliance hard-stop, not configurable']}},
 {id:'suppressed',   x:330,  y:520, type:'end',     icon:'stop',   title:'Opted Out', sub:'End state — no message sent', cats:[],
   info:{what:'Terminal state. The caller previously opted out, so text_back stays silent.', notes:['Missed call still appears on the owner dashboard for manual callback']}},
 {id:'intro',        x:620,  y:340, type:'action',  icon:'msg',    title:'Send Intro SMS', sub:'“Sorry we missed you” — first touch', cats:['intro'],
   info:null},
 {id:'replies',      x:910,  y:340, type:'logic',   icon:'branch', title:'Customer Replies?', sub:'Wait for inbound SMS', cats:[],
   info:{what:'Waits for an inbound reply from the caller. Any inbound text routes to Classify Reply; silence routes to the timed Follow-up Sequence.', notes:['Reply at ANY later point re-enters classification — follow-ups cancel instantly','Delivery receipts tracked; failed sends retry once, then alert the owner']}},
 {id:'classify',     x:1200, y:150, type:'logic',   icon:'zap',    title:'Classify Reply', sub:'Keyword policy — STOP / HELP / safety / other', cats:[],
   info:{what:'Deterministic keyword classifier. Checks the inbound text against ordered rule lists — no model, no guessing.', notes:['STOP, UNSUBSCRIBE, CANCEL, QUIT, END → Opt-Out Ack + suppression list','HELP, INFO → Help Info reply','Safety/human words (emergency, gas, sparks, flooding, “call me”, “real person”) → Human Handoff Alert','Anything else → slot-filling begins with Ask Service','Rules are evaluated top-down; first match wins']}},
 {id:'optout_ack',   x:1500, y:20,  type:'action',  icon:'stop',   title:'Opt-Out Ack', sub:'Confirm unsubscribe, add to list', cats:['stop_ack'], info:null},
 {id:'optout_end',   x:1790, y:20,  type:'end',     icon:'stop',   title:'Opted Out', sub:'End state — suppressed', cats:[],
   info:{what:'Terminal state after a STOP reply. Number added to the suppression list; one final confirmation was sent, then silence.', notes:['Carrier-level STOP handling is honoured even if our ack fails to send']}},
 {id:'help_info',    x:1500, y:150, type:'action',  icon:'help',   title:'Help Info', sub:'Explain the service, return to flow', cats:['help'],
   info:null},
 {id:'handoff',      x:1500, y:280, type:'action',  icon:'user',   title:'Human Handoff Alert', sub:'Page the owner + ack the customer', cats:['handoff'], info:null},
 {id:'handoff_end',  x:1790, y:280, type:'end',     icon:'user',   title:'Handoff to Human', sub:'End state — owner takes over', cats:[],
   info:{what:'Terminal state for automation. The owner has been paged (push + SMS) and the customer told a real person is coming. text_back stops driving the thread.', notes:['Thread stays visible in the dashboard with full history','If the owner does not acknowledge in 10 min, the page repeats once']}},
 {id:'followup',     x:1200, y:520, type:'wait',    icon:'clock',  title:'Follow-up Sequence', sub:'2h → 24h · quiet hours 9pm–8am deferred', cats:['followup1','followup2','quiet'],
   info:null},

const $ = s => document.querySelector(s);
const stage = $('#stage'), world = $('#world'), nodesEl = $('#nodes'), svg = $('#edgeSvg');
const NW = 224, NH = 62;
let view = {x:40, y:20, k:1};
let selections = {};
try{ selections = JSON.parse(localStorage.getItem('textback_selections')||'{}'); }catch(e){ selections = {}; }

function saveSel(){ localStorage.setItem('textback_selections', JSON.stringify(selections)); updateSelCount(); refreshBadges(); }
function updateSelCount(){ $('#selCount').textContent = Object.keys(selections).filter(k=>selections[k]).length; }

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tokify(s){ return esc(s).replace(/\{([a-z_0-9]+)\}/g, '<span class="tok">{$1}</span>'); }

function smsMeta(text){
  const nonGsm = /[^\x20-\x7E\n\r£¥èéùìòÇØøÅåÆæßÉÄÖÑÜäöñüà]/.test(text);
  const single = nonGsm ? 70 : 160, multi = nonGsm ? 67 : 153;
  const len = [...text].length;
  const seg = len <= single ? 1 : Math.ceil(len / multi);
  return {len, seg, enc: nonGsm ? 'UCS-2' : 'GSM-7'};
}

function compliance(t){
  const cat = CATS[t.cat];
  const badges = [];
  if(cat.optout){
    if(/reply stop|stop to opt out|stop = no more/i.test(t.text)) badges.push(['comp-ok','STOP language ✓']);
    else badges.push(['comp-warn','missing opt-out!']);
  }
  if(cat.stopack){
    if(/unsubscrib|opted out|no further|no more messages|texts are off/i.test(t.text)) badges.push(['comp-ok','opt-out confirmed ✓']);
    else badges.push(['comp-warn','must confirm unsubscribe']);
  }
  if(t.safety) badges.push(['comp-ok','safety variant']);
  return badges;
}

    const color = COLORS[n.type];
    d.innerHTML = `
      <div class="nicon" style="background:${color}">${ICONS[n.icon]}</div>
      <div class="nbody">
        <div class="ntitle">${n.title}</div>
        <div class="nsub">${n.sub}</div>
      </div>
      <div class="badge">✓</div>
      ${n.cats.length ? '<div class="msgTag">'+n.cats.length+' message'+(n.cats.length>1?'s':'')+' · click to choose</div>' : ''}`;
    d.addEventListener('click', ev => { ev.stopPropagation(); openPanel(n.id); });
    nodesEl.appendChild(d);
  });
  refreshBadges();
}

function refreshBadges(){
  NODES.forEach(n => {
    if(!n.cats.length) return;
    const done = n.cats.every(c => selections[c]);
    document.getElementById('node-'+n.id).classList.toggle('hasSel', done);
  });
}

/* ---------- render edges ---------- */
function renderEdges(){
  let maxX = 0, maxY = 0;
  NODES.forEach(n => { maxX = Math.max(maxX, n.x + NW + 200); maxY = Math.max(maxY, n.y + NH + 200); });
  svg.setAttribute('width', maxX); svg.setAttribute('height', maxY);
  let html = '';
  EDGES.forEach(e => {
    const a = nodeMap[e.from], b = nodeMap[e.to];
    let x1, y1, x2, y2;
    if(b.x >= a.x + NW - 20){ x1 = a.x + NW; y1 = a.y + NH/2; x2 = b.x; y2 = b.y + NH/2; }
    else if(b.x + NW <= a.x + 20){ x1 = a.x; y1 = a.y + NH/2; x2 = b.x + NW; y2 = b.y + NH/2; }
    else if(b.y > a.y){ x1 = a.x + NW/2; y1 = a.y + NH; x2 = b.x + NW/2; y2 = b.y; }
    else { x1 = a.x + NW/2; y1 = a.y; x2 = b.x + NW/2; y2 = b.y + NH; }
    const dx = Math.abs(x2 - x1), dy = Math.abs(y2 - y1);
    let path;
    if(dx >= dy){
      const c = Math.max(dx * 0.45, 40) * (x2 >= x1 ? 1 : -1);
      path = `M ${x1} ${y1} C ${x1+c} ${y1}, ${x2-c} ${y2}, ${x2} ${y2}`;
    } else {
      const c = Math.max(dy * 0.45, 40) * (y2 >= y1 ? 1 : -1);
      path = `M ${x1} ${y1} C ${x1} ${y1+c}, ${x2} ${y2-c}, ${x2} ${y2}`;
    }
    html += `<path class="edgePath" d="${path}"/>`;
    html += `<circle class="port" cx="${x1}" cy="${y1}" r="4"/><circle class="port" cx="${x2}" cy="${y2}" r="4"/>`;
    if(e.label){
      const mx = (x1+x2)/2, my = (y1+y2)/2;
      const w = e.label.length * 6.4 + 16;
      html += `<rect class="edgeLabelBg" x="${mx-w/2}" y="${my-11}" width="${w}" height="20" rx="7"/>`;
      html += `<text class="edgeLabel" x="${mx}" y="${my+3.5}" text-anchor="middle">${e.label}</text>`;
    }
  });
  svg.innerHTML = html;
}

/* ---------- pan & zoom ---------- */
function applyView(){
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  $('#zoomPct').textContent = Math.round(view.k*100) + '%';
}
let panning = false, px = 0, py = 0;
stage.addEventListener('mousedown', e => {
  if(e.target.closest('.node')) return;
  panning = true; px = e.clientX; py = e.clientY; stage.classList.add('panning');
});
window.addEventListener('mousemove', e => {
  if(!panning) return;
  view.x += e.clientX - px; view.y += e.clientY - py;
  px = e.clientX; py = e.clientY; applyView();
});
window.addEventListener('mouseup', () => { panning = false; stage.classList.remove('panning'); });
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.1 : 1/1.1;
  const nk = Math.min(2.2, Math.max(0.25, view.k * factor));
  view.x = mx - (mx - view.x) * (nk / view.k);
  view.y = my - (my - view.y) * (nk / view.k);
  view.k = nk; applyView();
}, {passive:false});
function zoomBy(f){
  const rect = stage.getBoundingClientRect();
  const mx = rect.width/2, my = rect.height/2;
  const nk = Math.min(2.2, Math.max(0.25, view.k * f));
  view.x = mx - (mx - view.x) * (nk / view.k);
  view.y = my - (my - view.y) * (nk / view.k);
  view.k = nk; applyView();
}
function fitView(){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  NODES.forEach(n => { minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); maxX=Math.max(maxX,n.x+NW); maxY=Math.max(maxY,n.y+NH); });
  const rect = stage.getBoundingClientRect();
  const pad = 60;
  const k = Math.min((rect.width-pad*2)/(maxX-minX), (rect.height-pad*2)/(maxY-minY), 1.4);
  view.k = k;
  view.x = (rect.width - (maxX-minX)*k)/2 - minX*k;
  view.y = (rect.height - (maxY-minY)*k)/2 - minY*k;
  applyView();
}
$('#zin').onclick = () => zoomBy(1.2);
$('#zout').onclick = () => zoomBy(1/1.2);
$('#zfit').onclick = fitView;
$('#fitBtn').onclick = fitView;

/* ---------- node detail panel ---------- */
let curNode = null, curCat = null, curTone = 'all', curSearch = '';

function openPanel(id){
  curNode = nodeMap[id]; curTone = 'all'; curSearch = ''; $('#pSearch').value = '';
  document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
  document.getElementById('node-'+id).classList.add('active');
  $('#drawer').classList.remove('open');
  const n = curNode;
  $('#pIcon').style.background = COLORS[n.type];
  $('#pIcon').innerHTML = ICONS[n.icon];
  $('#pTitle').textContent = n.title;
  $('#pSub').textContent = n.sub;
  const tabs = $('#pTabs');
  if(n.cats.length){
    tabs.style.display = 'flex';
    $('#pTools').style.display = 'block';
    tabs.innerHTML = n.cats.map((c,i) => `<button class="ptab${i===0?' on':''}" data-cat="${c}">${CATS[c].name}</button>`).join('');
    tabs.querySelectorAll('.ptab').forEach(b => b.onclick = () => {
      tabs.querySelectorAll('.ptab').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); curCat = b.dataset.cat; renderTemplates();
    });
    curCat = n.cats[0];
    renderToneChips();
    renderTemplates();
  } else {
    tabs.style.display = 'none';
    $('#pTools').style.display = 'none';
    curCat = null;
    renderInfo();
  }
  $('#panel').classList.add('open');
}

function renderToneChips(){
  const row = $('#toneRow');
  row.innerHTML = '<button class="tchip on" data-tone="all">All tones</button>' +
    Object.entries(TONES).map(([k,v]) => `<button class="tchip" data-tone="${k}">${v}</button>`).join('');
  row.querySelectorAll('.tchip').forEach(b => b.onclick = () => {
    row.querySelectorAll('.tchip').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); curTone = b.dataset.tone; renderTemplates();
  });
}

function renderInfo(){
  const n = curNode, info = n.info || {};
  let html = '<div class="infoBlock">';
  if(info.what) html += `<p>${info.what}</p>`;
  if(info.notes && info.notes.length){
    html += '<h4>Policy notes</h4><ul>' + info.notes.map(x => `<li>${x}</li>`).join('') + '</ul>';
  }
  html += '<h4>Placeholders available</h4><p><code>{business_name}</code> <code>{customer_name}</code> <code>{service}</code> <code>{location}</code> <code>{time}</code></p>';
  html += '</div>';
  $('#pBody').innerHTML = html;
}

function renderTemplates(){
  const cat = CATS[curCat];
  const note = NODE_NOTES[curNode.id];
  const list = TEMPLATES.filter(t => t.cat === curCat)
    .filter(t => curTone === 'all' || t.tone === curTone)
    .filter(t => !curSearch || (t.text + ' ' + INDS[t.ind] + ' ' + TONES[t.tone]).toLowerCase().includes(curSearch));
  const total = TEMPLATES.filter(t => t.cat === curCat).length;
  let html = '';
  if(note) html += `<div class="pnote">${note}</div>`;
  html += `<div class="pnote" style="background:rgba(74,144,226,.07);border-color:rgba(74,144,226,.3);color:#a8c8ee">${cat.desc}</div>`;
  html += `<div class="tcount">${list.length} of ${total} templates${curTone!=='all'?' · '+TONES[curTone]:''}${curSearch?' · “'+esc(curSearch)+'”':''}</div>`;
  list.forEach(t => {
    const sel = selections[curCat] === t.id;
    const m = smsMeta(t.text);
    const badges = compliance(t);
    html += `<div class="tcard${sel?' sel':''}" data-id="${t.id}">
      <div class="trow">
        <span class="radio"></span>
        <span class="pill tone-${t.tone}">${TONES[t.tone]}</span>
        ${t.ind !== 'general' ? `<span class="pill ind">${INDS[t.ind]}</span>` : ''}
        ${badges.map(b => `<span class="pill ${b[0]}">${b[1]}</span>`).join('')}
        <button class="copyBtn" data-copy="${t.id}">copy</button>
      </div>
      <div class="ttext">${tokify(t.text)}</div>
      <div class="tfoot">
        <span class="${m.len>160?'over':''}">${m.len} chars</span>
        <span>${m.seg} segment${m.seg>1?'s':''}</span>
        <span>${m.enc}</span>
        ${sel ? '<span style="color:var(--green);font-weight:700">✓ selected for this step</span>' : ''}
      </div>
    </div>`;
  });
  if(!list.length) html += '<div class="tcount" style="padding:20px 4px">No templates match — clear the filter or search.</div>';
  $('#pBody').innerHTML = html;
  $('#pBody').querySelectorAll('.tcard').forEach(c => c.addEventListener('click', e => {
    if(e.target.closest('.copyBtn')) return;
    const id = c.dataset.id;
    selections[curCat] = (selections[curCat] === id) ? null : id;
    saveSel(); renderTemplates();
  }));
  $('#pBody').querySelectorAll('.copyBtn').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const t = TEMPLATES.find(x => x.id === b.dataset.copy);
    navigator.clipboard.writeText(t.text).then(() => {
      b.textContent = 'copied ✓'; b.classList.add('done');
      setTimeout(() => { b.textContent = 'copy'; b.classList.remove('done'); }, 1400);
      toast('Template copied to clipboard');
    }).catch(() => toast('Copy failed — select the text manually'));
  }));
}

$('#pSearch').addEventListener('input', e => { curSearch = e.target.value.trim().toLowerCase(); if(curCat) renderTemplates(); });
$('#pClose').onclick = () => {
  $('#panel').classList.remove('open');
  document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
};
stage.addEventListener('click', e => {
  if(!e.target.closest('.node')){
    $('#panel').classList.remove('open');
    document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
  }
});

/* ---------- selections drawer ---------- */
function renderDrawer(){
  const order = Object.entries(CATS).sort((a,b) => a[1].order - b[1].order);
  let html = '';
  order.forEach(([key, cat]) => {
    const selId = selections[key];
    const t = selId ? TEMPLATES.find(x => x.id === selId) : null;
    const nodeTitle = nodeMap[cat.node].title;
    html += `<div class="dItem">
      <div class="dstep">${cat.order}. ${cat.name} <span style="color:var(--faint);font-weight:500;text-transform:none">· ${nodeTitle}</span></div>`;
    if(t){
      const m = smsMeta(t.text);
      html += `<div class="dtext">${tokify(t.text)}</div>
        <div class="dmeta">${TONES[t.tone]}${t.ind!=='general' ? ' · ' + INDS[t.ind] : ''} · ${m.len} chars · ${m.seg} seg</div>`;
    } else {
      html += `<div class="dempty">No response chosen yet — click the “${nodeTitle}” node.</div>`;
    }
    html += '</div>';
  });
  $('#dBody').innerHTML = html;
}
$('#drawerBtn').onclick = () => {
  $('#panel').classList.remove('open');
  renderDrawer();
  $('#drawer').classList.add('open');
};
$('#dClose').onclick = () => $('#drawer').classList.remove('open');
$('#clearBtn').onclick = () => {
  if(!confirm('Clear all selected responses?')) return;
  selections = {}; saveSel(); renderDrawer();
};
$('#exportBtn').onclick = () => {
  const order = Object.entries(CATS).sort((a,b) => a[1].order - b[1].order);
  const out = {
    product:'text_back', artifact:'response-selections',
    exported_at:new Date().toISOString(),
    selections: order.map(([key, cat]) => {
      const t = selections[key] ? TEMPLATES.find(x => x.id === selections[key]) : null;
      return {
        step: cat.order, category: key, category_name: cat.name, node: cat.node,
        template_id: t ? t.id : null,
        tone: t ? TONES[t.tone] : null,
        industry: t ? INDS[t.ind] : null,
        text: t ? t.text : null,
        chars: t ? smsMeta(t.text).len : null,
        segments: t ? smsMeta(t.text).seg : null
      };
    })
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'textback-response-selections.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Selections exported as JSON');
};

let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- boot ---------- */
renderNodes();
renderEdges();
updateSelCount();
fitView();
window.addEventListener('resize', () => {});
</script>
</body>
</html>
